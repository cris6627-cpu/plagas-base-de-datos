<style>

/* FONDO */
body{
    margin:0;
    font-family:Arial, sans-serif;
    display:flex;
    background:#ecf0f1;
}

/* TÍTULO */
h1{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    margin:0;
    padding:20px;
    background:#3498db;
    color:white;
    z-index:1000;
}

/* MENÚ */
#lista{
    width:280px;
    background:#2c3e50;
    height:100vh;
    overflow-y:auto;
    margin-top:80px;
    padding:0;
}

/* BOTONES */
#lista li{
    list-style:none;
    color:white;
    padding:15px;
    border-bottom:1px solid #3d566e;
    cursor:pointer;
    transition:0.3s;
}

#lista li:hover{
    background:#34495e;
}

/* CONTENIDO */
#detalle{
    flex:1;
    padding:100px 30px 30px 30px;
}

/* TARJETA */
.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

/* IMAGEN */
.card img{
    width:350px;
    max-width:100%;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0px 0px 10px gray;
}

/* TEXTO */
h2{
    color:#2c3e50;
}

p{
    line-height:1.6;
}

b{
    color:#2980b9;
}

</style>

</head>

/* CREAR MENÚ */

    li.textContent = p.nombreComun;

    li.onclick = () => {

        detalle.innerHTML = `

            <h2>${p.nombreComun}</h2>
